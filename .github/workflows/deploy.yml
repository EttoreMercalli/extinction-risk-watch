name: Deploy su GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Aggiorna e ripubblica automaticamente ogni 6 ore (e/o trigger manuale)
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Permessi richiesti per il deployment ufficiale su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests xlrd

      - name: Estrazione Dati e Calcolo Indice
        run: |
          python extract_data.py
          python build_site_data.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact statico della cartella public
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
